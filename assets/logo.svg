<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fias English · v2 mark: warm gradient squircle + a smiling speech bubble that talks -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE45A"/>
      <stop offset=".55" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FF8A1F"/>
    </linearGradient>
    <radialGradient id="shine" cx=".22" cy=".12" r=".7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF4D6"/>
    </linearGradient>
  </defs>
  <!-- squircle tile -->
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="136" fill="url(#shine)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="134.5" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3"/>
  <!-- bubble shadow -->
  <path d="M250 112c92 0 156 55 156 132s-64 132-156 132c-20 0-39-3-56-8l-66 36 15-62c-31-24-49-58-49-98 0-77 64-132 156-132z" fill="#B85C00" opacity=".22" transform="translate(6 12)"/>
  <!-- speech bubble -->
  <path class="bubble" d="M250 112c92 0 156 55 156 132s-64 132-156 132c-20 0-39-3-56-8l-66 36 15-62c-31-24-49-58-49-98 0-77 64-132 156-132z" fill="url(#bub)"/>
  <!-- face -->
  <g class="eyes" fill="#1A1A1A">
    <ellipse cx="203" cy="222" rx="20" ry="27"/>
    <ellipse cx="297" cy="222" rx="20" ry="27"/>
    <circle cx="210" cy="211" r="7" fill="#FFFFFF"/>
    <circle cx="304" cy="211" r="7" fill="#FFFFFF"/>
  </g>
  <ellipse cx="168" cy="272" rx="18" ry="11" fill="#FF8FA3" opacity=".8"/>
  <ellipse cx="332" cy="272" rx="18" ry="11" fill="#FF8FA3" opacity=".8"/>
  <g class="mouth">
    <path d="M196 266q54 62 108 0z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="10" stroke-linejoin="round"/>
    <path d="M224 296q26-18 52 0q-12 14-26 14t-26-14z" fill="#FF5C7A"/>
  </g>
  <!-- voice waves -->
  <g class="waves" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="16">
    <path d="M424 168q18 22 14 50"/>
    <path d="M448 136q32 40 24 92"/>
  </g>
</svg>
